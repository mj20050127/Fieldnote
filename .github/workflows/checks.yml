name: Project checks
on: [push, pull_request]
jobs:
  check:
    # ubuntu-latest moved to 26.04; its kernel triggers MongoDB 8.0 SERVER-121912.
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q -p no:cacheprovider
      - run: npm ci
        working-directory: frontend
      - run: python scripts/export_openapi.py
      - run: npm --prefix frontend run generate:api
      - run: git diff --exit-code frontend/openapi.json frontend/src/api.generated.ts
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/fieldnote.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:8000/api/health && break; sleep 1; done
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
